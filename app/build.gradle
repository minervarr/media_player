plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.paparazzi)
}

android {
    namespace 'com.example.media_player'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.example.media_player"
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("../bruno.jks")
            storePassword "Tetas//2004//"
            keyAlias "brunoKey"
            keyPassword "Tetas//2004//"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "x86_64"
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    aaptOptions {
        noCompress 'bin'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(':audioengine')
    implementation project(':kobuzapi')
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.media
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}